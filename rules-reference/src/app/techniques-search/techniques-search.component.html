<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <div ngbDropdown class="d-inline-block me-4">
      <h6 style="white-space: nowrap;">{{ filteredTechniques.length + ' Techniques' }}</h6>
    </div>
    <div ngbDropdown class="d-inline-block me-5">
			<button type="button" class="btn btn-outline-primary" id="dropdown-marital-level" ngbDropdownToggle [innerHTML]="getCurrentlySelectedLevelText()"></button>
			<div ngbDropdownMenu aria-labelledby="dropdown-marital-level">
        <button ngbDropdownItem (click)="onTechniqueLevelFilterChange(TechniqueLevel.ALL)">All Technique Levels</button>
				<button ngbDropdownItem (click)="onTechniqueLevelFilterChange(TechniqueLevel.BASIC)">Basic Techniques</button>
				<button ngbDropdownItem (click)="onTechniqueLevelFilterChange(TechniqueLevel.ADVANCED)">Advanced Techniques</button>
				<button ngbDropdownItem (click)="onTechniqueLevelFilterChange(TechniqueLevel.MASTER)">Master Techniques</button>
        <button ngbDropdownItem (click)="onTechniqueLevelFilterChange(TechniqueLevel.TRANSCENDENT)">Transcendent Techniques</button>
			</div>
		</div>
    <div ngbDropdown class="d-inline-block me-5">
			<button type="button" class="btn btn-outline-primary" id="dropdown-marital-type" ngbDropdownToggle [innerHTML]="getCurrentlySelectedTypeText()"></button>
			<div ngbDropdownMenu aria-labelledby="dropdown-marital-type" >
        <button ngbDropdownItem (click)="onTechniqueTypeFilterChange(TechniqueType.ALL)">All Technique Types</button>
				<button ngbDropdownItem (click)="onTechniqueTypeFilterChange(TechniqueType.AGILE)">Agile Techniques</button>
				<button ngbDropdownItem (click)="onTechniqueTypeFilterChange(TechniqueType.BRAWL)">Brawl Techniques</button>
				<button ngbDropdownItem (click)="onTechniqueTypeFilterChange(TechniqueType.FORTITUDE)">Fortitude Techniques</button>
        <button ngbDropdownItem (click)="onTechniqueTypeFilterChange(TechniqueType.LEADER)">Leader Techniques</button>
        <button ngbDropdownItem (click)="onTechniqueTypeFilterChange(TechniqueType.TACTICAL)">Tactical Techniques</button>
			</div>
		</div>
    <div ngbDropdown class="d-inline-block me-5">
			<button type="button" class="btn btn-outline-primary" id="dropdown-technique-ability-cost" ngbDropdownToggle [innerHTML]="getCurrentlySelectedTechniqueCostText()"></button>
			<div ngbDropdownMenu aria-labelledby="dropdown-technique-ability-cost" >
        <button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.ANY)">Any Ability Cost</button>
				<button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.MP)">Techniques with [MP] Cost</button>
				<button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.AP1)">Techniques with 1 [AP] Cost</button>
        <button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.AP2)">Techniques with 2 [AP] Cost</button>
        <button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.AP3)">Techniques with 3 [AP] Cost</button>
        <button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.AP4)">Techniques with 4 [AP] Cost</button>
        <button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.AP5)">Techniques with 5 [AP] Cost</button>
        <button ngbDropdownItem (click)="onTechniqueCostChange(TechniqueCost.AP6)">Techniques with 6 [AP] Cost</button>
			</div>
		</div>
    <input class="form-control me-2" type="search" placeholder="Search in name and tags" aria-label="Search" (input)="onFreeTextFilterChange()" [(ngModel)]="currentFilterText">
  </div>
</nav>
<div class="container">
  <div class="row row-cols-lg-3 g-3">
      @for (technique of filteredTechniques; track $index) {
        <div class="col" style="min-width: 400px;">
          <app-ability [ability]="technique"></app-ability>
        </div>
      }
  </div>
</div>
