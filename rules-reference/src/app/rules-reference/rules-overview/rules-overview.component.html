<div>
    <h3 ngbScrollSpyFragment="introduction">Introduction</h3>
    <app-dynamic-content [content]="'system_description' | resolveTextKey | textProcessor"></app-dynamic-content>

    <h4 class="pt-3" ngbScrollSpyFragment="keywords">Keywords</h4>
    <app-dynamic-content [content]="'keywords_description' | resolveTextKey | textProcessor"></app-dynamic-content>

    <h3 class="pt-3" >Core Gameplay</h3>
    <h4 class="pt-3" ngbScrollSpyFragment="d20-test">D20 Test</h4>
    <app-dynamic-content [content]="'d20_test_description' | resolveTextKey | textProcessor"></app-dynamic-content>

    <h5 class="pt-3" ngbScrollSpyFragment="d20-test">Specialized D20 Test</h5>
    <app-dynamic-content [content]="'d20_test_specializations_description' | resolveTextKey | textProcessor"></app-dynamic-content>

    <h4 class="pt-3" ngbScrollSpyFragment="dt">Difficulty Threshold</h4>
    <app-dynamic-content [content]="'difficulty_threshold_description' | resolveTextKey | textProcessor"></app-dynamic-content>

    <div class="d-flex justify-content-center">
        <table class="rules-table-50">
            <thead>
                <tr>
                    <th scope="col">[DT] Number</th>
                    <th scope="col">[DT] Description</th>
                </tr>
            </thead>
            <tbody>
                @for (dt of difficultyThreshold; track $index) {
                    <tr>
                        <td>{{ dt.dtNumber }}</td>
                        <td>{{ dt.webkey | resolveTextKey}}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>

    <h4 class="pt-3" ngbScrollSpyFragment="adv-disadv">Advantage and Disadvantage</h4>
    <app-dynamic-content [content]="'advantage_disadvantage' | resolveTextKey | textProcessor"></app-dynamic-content>

    <h4 class="pt-3" ngbScrollSpyFragment="abilities">Abilities</h4>
    <app-dynamic-content [content]="'abilitiies_description' | resolveTextKey | textProcessor"></app-dynamic-content>
</div>
