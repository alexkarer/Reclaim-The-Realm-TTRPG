<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <div ngbDropdown class="d-inline-block ms-5 me-5">
            <button type="button" class="btn btn-outline-primary" id="dropdown-equipment-tag" ngbDropdownToggle>Tag Filters {{ `(${currentFilterTags.length})` }}</button>
            <div ngbDropdownMenu aria-labelledby="dropdown-equipment-tag">
                <div class="d-flex justify-content-center flex-column mx-2">
                @for (tag of filterTags; track $index) {
                    <input type="checkbox" class="btn-check" [id]="'btncheck' + tag" autocomplete="off" (change)="onEquipmentTagCheckboxToggle($event, tag)">
                    <label class="btn btn-outline-primary my-1" [for]="'btncheck' + tag">{{ tag }}</label>
                }
                </div>
            </div>
        </div>
        <input class="form-control me-2" type="search" placeholder="Search in name, tags and description"
            aria-label="Search" (input)="onFreeTextFilterChange()" [(ngModel)]="currentFilterText">
    </div>
</nav>
<div class="container g-5">
    <div class="row">
        <div class="col">
            <div class="mt-5">
                <app-equipment [equipment]="selectedEquipment"></app-equipment>
            </div>
        </div>
        <div class="col">
            <div ngbDropdown class="d-inline-block">
                <h5 style="white-space: nowrap;">{{ filteredEquipment.length + ' Item(s)' }}</h5>
            </div>
            <div class="row row-cols-lg-auto g-3">
                @for (equipment of filteredEquipment; track $index) {
                    <div class="col">
                        <img [class]="'equipment-image' + ((selectedEquipment.name === equipment.name) ? ' selected' : ' not-selected')" 
                        [src]="equipment.meta.iconPath" 
                        [ngbTooltip]="equipment.name"
                        (click)="onSelectEquipment(equipment.name)">
                    </div>
                }
            </div>
        </div>
    </div>
</div>
