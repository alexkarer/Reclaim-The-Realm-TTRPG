      <div ngbDropdownMenu aria-labelledby="dropdown-technique-ability-tag">
        <div class="d-flex justify-content-center flex-column mx-2">
          @for (tag of filterTags; track $index) {
            <input type="checkbox" class="btn-check" [id]="'btncheck' + tag" autocomplete="off" (change)="handleAbilityTagCheckBoxUpdate($event, tag)">

<div class="container g-5">
    <div class="row">
        <div class="col">
            <div class="mt-5">
              <app-ability [ability]="selectedSpell"></app-ability>
            </div>
        </div>
        <div class="col">
            <div ngbDropdown class="d-inline-block">
                <h5 style="white-space: nowrap;">{{ filteredSpells.length + ' Spell(s)' }}</h5>
            </div>
            <div class="row row-cols-lg-auto g-3">
                @for (spell of filteredSpells; track $index) {
                  <div class="col">
                    <div [class]="'spell-wrapper background-' + getColourClass(spell) + ((selectedSpell.name === spell.name) ? ' border-selected' : ' border-notselected')">
                        <img class="spell-image" 
                        [src]="spell.meta.iconPath" 
                        [ngbTooltip]="spell.name"
                        (click)="onSelectTechnique(spell.name)">
                    </div>
                  </div>
                }
            </div>
        </div>
    </div>
</div>
