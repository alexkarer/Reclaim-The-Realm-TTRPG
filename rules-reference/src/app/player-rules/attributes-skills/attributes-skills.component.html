<h4>Attributes</h4>

<app-dynamic-content [content]="'class_skills' | resolveTextKey | textProcessor"></app-dynamic-content>

<ul>
    @for (attr of attributes; track $index) {
        <li>
            <span class="fw-bold">{{ attr.name }}: </span><app-dynamic-content [content]="attr.fulldescription | resolveTextKey | textProcessor"></app-dynamic-content>
        </li>
    }
</ul>

<h5 class="mb-0">Assigning and Improving Attributes</h5>

<app-dynamic-content [content]="'assigning_attributes' | resolveTextKey | textProcessor"></app-dynamic-content>

<h5 class="mb-0 mt-2">Attribute Tests</h5>

<app-dynamic-content [content]="'attribute_tests' | resolveTextKey | textProcessor"></app-dynamic-content>
