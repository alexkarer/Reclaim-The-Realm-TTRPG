<h4>Attributes</h4>

<app-dynamic-content [content]="'class_skills' | resolveTextKey | textProcessor"></app-dynamic-content>

<ul>
    @for (attr of attributes; track $index) {
        <li>
            <span class="fw-bold">{{ attr.name }}: </span><app-dynamic-content [content]="attr.fulldescription | resolveTextKey | textProcessor"></app-dynamic-content>
        </li>
    }
</ul>

<h5 class="mb-0">Assigning and Improving Attributes</h5>

<app-dynamic-content [content]="'assigning_attributes' | resolveTextKey | textProcessor"></app-dynamic-content>

<h5 class="mb-0 mt-2">Attribute Tests</h5>

<app-dynamic-content [content]="'attribute_tests' | resolveTextKey | textProcessor"></app-dynamic-content>

<h4 class="mt-3">Skills</h4>

<app-dynamic-content [content]="'skills_description' | resolveTextKey | textProcessor"></app-dynamic-content>

<h5 class="mb-0 mt-2">Assigning and Improving Skills</h5>

<app-dynamic-content [content]="'assigning_skills' | resolveTextKey | textProcessor"></app-dynamic-content>
<br>
<em class="text-info"><app-dynamic-content [content]="'stacking_class_skills' | resolveTextKey | textProcessor"></app-dynamic-content></em>

<p class="text-danger">Add Lists of Skills</p>

<h5 class="mb-0 mt-2">Skill Tests</h5>
<app-dynamic-content [content]="'skill_tests' | resolveTextKey | textProcessor"></app-dynamic-content>

<h5 class="mb-0 mt-2">Helping Others</h5>
<app-dynamic-content [content]="'helping_others' | resolveTextKey | textProcessor"></app-dynamic-content>
