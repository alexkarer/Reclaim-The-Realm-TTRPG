<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10 col-xl-8">
      <h1 class="mb-4">Player Rules - Table of Contents</h1>

      <div class="card">
        <div class="card-body">
          <div class="list-group list-group-flush">
            @for (page of topLevelPages; track page.id) {
              <div>
                <a [routerLink]="page.route" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                  <div>
                    <h5 class="mb-1">{{ page.title }}</h5>
                  </div>
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-chevron-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
                  </svg>
                </a>

                @if (hasChildren(page.id)) {
                  <div class="list-group ms-4">
                    @for (child of getChildren(page.id); track child.id) {
                      <a [routerLink]="child.route" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        <span>{{ child.order - 1 }}. {{ child.title }}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-right" viewBox="0 0 16 16">
                          <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
                        </svg>
                      </a>
                    }
                  </div>
                }
              </div>
            }
          </div>
        </div>
      </div>

      @if (topLevelPages.length > 0) {
        <div class="mt-4">
          <a [routerLink]="topLevelPages[0].route" class="btn btn-primary btn-lg">
            Start Reading
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-chevron-right ms-2" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
            </svg>
          </a>
        </div>
      }
    </div>
  </div>
</div>
