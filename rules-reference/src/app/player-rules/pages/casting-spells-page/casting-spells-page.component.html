<h1>Casting Spells</h1>

<div class="my-4">
  <h3 class="mt-3 mb-1">Spell Disciplines</h3>
  <div class="mt-2 d-flex flex-column">
    @for (majorDiscipline of spellsRulesJson.spellDisciplines; track $index) {
      <div class="p-2 my-2 border bg-body-secondary">
        <h4 class="mb-0">{{ majorDiscipline.name }}</h4>
        <app-dynamic-content [content]="majorDiscipline.textkey | resolveTextKey | textProcessor"></app-dynamic-content>
        <div class="mt-2 row">
          @for (subDiscipline of majorDiscipline.subdisciplines; track $index) {
            <div [class]="'col mx-1 p-2 discipline-wrapper discipline-' + subDiscipline.color">
              <h5 class="mb-0">{{ subDiscipline.name }}</h5>
              <app-dynamic-content [content]="subDiscipline.textkey | resolveTextKey | textProcessor"></app-dynamic-content>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>

<app-player-rules-page-navigation [currentPageId]="pageId"></app-player-rules-page-navigation>
