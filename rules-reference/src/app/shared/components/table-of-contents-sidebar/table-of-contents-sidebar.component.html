<nav class="toc-sidebar">
  <h6 class="toc-title mb-3">{{ title() }}</h6>

  <div class="nav flex-column">
    @for (page of topLevelPages; track page.id) {
      <div class="toc-section mb-2">
        <a
          [routerLink]="page.route"
          routerLinkActive="active"
          class="nav-link toc-parent-link"
        >
          {{ page.title }}
        </a>

        @if (getChildPages(page.id).length > 0) {
          <div class="nav flex-column ms-3">
            @for (child of getChildPages(page.id); track child.id) {
              <a
                [routerLink]="child.route"
                routerLinkActive="active"
                class="nav-link toc-child-link"
              >
                {{ child.order - 1 }}. {{ child.title }}
              </a>
            }
          </div>
        }
      </div>
    }
  </div>
</nav>
