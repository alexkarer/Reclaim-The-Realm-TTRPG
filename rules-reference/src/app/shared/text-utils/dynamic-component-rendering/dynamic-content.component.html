<ng-container>
    @for (contentPart of content(); track $index) {
        @if (contentPart.type === 'text') {
            <span class="description" [innerHTML]="contentPart.text"></span>
        }
        @if (contentPart.type === 'keyword') {
            <app-keyword 
                [keyword]="contentPart.component?.keyword" 
                [link]="contentPart.component?.link ?? ''"
                [toolTip]="contentPart.component?.toolTipText"
            ></app-keyword>
        }
        @if (contentPart.type === 'tag') {
            <em class="text-body-emphasis" [innerHTML]="contentPart.text" [ngbTooltip]="getTagTooltipText(contentPart.text)" ></em>
        }
        @if (contentPart.type === 'ability') {
            <em class="text-body-emphasis fw-bold" [innerHTML]="contentPart.text" [ngbTooltip]="abilityTooltip" triggers="mouseenter:mouseleave"></em>
            <ng-template #abilityTooltip>
                @if (contentPart.ability) {
                    <app-ability [ability]="contentPart.ability"></app-ability>
                }
            </ng-template>
        }
    }
</ng-container>
